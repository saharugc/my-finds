<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Blog — Sahar's Finds</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --rose:#fce8ed;--rose2:#f5ccd4;--rose3:#c97a8a;--rose4:#a05060;
  --sage:#e8ede6;--sand:#f7f2eb;--lav:#eeeaf8;
  --cream:#fffaf6;--text:#2e2020;--muted:#9a7878;--light:#fdf5f0;
}
html{scroll-behavior:smooth}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
nav{background:rgba(255,250,246,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--rose2);position:sticky;top:0;z-index:100}
.nav-top{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:52px}
.nav-logo{font-family:'Playfair Display',serif;font-size:17px;color:var(--text);text-decoration:none;margin-right:auto}
.nav-link{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:100px;border:1px solid var(--rose2);transition:all .18s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.nav-link:hover,.nav-link:active{background:var(--rose);color:var(--text)}
.nav-link.active{background:var(--rose3);border-color:var(--rose3);color:#fff}
.blog-hero{background:linear-gradient(145deg,#fce4ec 0%,#f8eaf2 40%,#ece6f8 80%,#e6f0e4 100%);padding:40px 20px 36px;text-align:center;position:relative;overflow:hidden}
.blog-hero::before{content:'';position:absolute;top:-50px;right:-60px;width:180px;height:180px;border-radius:50%;background:rgba(238,234,248,.5)}
.blog-hero::after{content:'';position:absolute;bottom:-30px;left:-40px;width:140px;height:140px;border-radius:50%;background:rgba(252,228,236,.45)}
.blog-hero-inner{position:relative;z-index:1}
.blog-eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--rose3);margin-bottom:10px}
.blog-hero h1{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,46px);font-weight:400;line-height:1.1;margin-bottom:10px}
.blog-hero h1 em{font-style:italic;color:var(--rose3)}
.blog-hero p{font-size:13.5px;color:var(--muted);line-height:1.7;max-width:400px;margin:0 auto}
.blog-filters{display:flex;gap:7px;padding:14px 16px;overflow-x:auto;scrollbar-width:none;max-width:860px;margin:0 auto;-webkit-overflow-scrolling:touch}
.blog-filters::-webkit-scrollbar{display:none}
.blog-filter-btn{padding:5px 15px;border-radius:100px;border:1px solid var(--rose2);background:transparent;font-family:'Jost',sans-serif;font-size:12.5px;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.blog-filter-btn:hover,.blog-filter-btn:active{background:var(--rose);color:var(--text)}
.blog-filter-btn.active{background:var(--rose3);border-color:var(--rose3);color:#fff}
.blog-list-wrap{max-width:860px;margin:0 auto;padding:8px 16px 80px}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.loading-spinner{width:32px;height:32px;border:2px solid var(--rose2);border-top-color:var(--rose3);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.post-featured{display:grid;grid-template-columns:1fr;gap:0;background:#fff;border-radius:20px;border:1px solid var(--rose2);overflow:hidden;text-decoration:none;color:inherit;margin-bottom:28px;transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
@media(min-width:600px){.post-featured{grid-template-columns:1.2fr 1fr}}
.post-featured:active{transform:scale(.99)}
@media(hover:hover){.post-featured:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(180,100,120,.13)}}
.post-featured-img{aspect-ratio:16/9;overflow:hidden;background:var(--rose)}
@media(min-width:600px){.post-featured-img{aspect-ratio:auto;min-height:260px}}
.post-featured-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;display:block}
@media(hover:hover){.post-featured:hover .post-featured-img img{transform:scale(1.04)}}
.post-featured-body{padding:22px 22px 24px;display:flex;flex-direction:column;justify-content:center}
.post-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--rose3);background:var(--rose);border-radius:100px;padding:3px 10px;font-weight:500;margin-bottom:10px;width:fit-content}
.post-featured-body h2{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,26px);font-weight:400;line-height:1.25;margin-bottom:8px}
.post-featured-body p{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:14px;flex:1}
.post-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
.read-more{font-size:12.5px;color:var(--rose3);font-weight:500;margin-top:14px}
.posts-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:480px){.posts-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:720px){.posts-grid{grid-template-columns:repeat(3,1fr)}}
.post-card{background:#fff;border-radius:18px;border:1px solid var(--rose2);overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.post-card:active{transform:scale(.98)}
@media(hover:hover){.post-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(180,100,120,.12)}}
.post-card-img{aspect-ratio:16/9;overflow:hidden;background:var(--rose)}
.post-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .35s;display:block}
@media(hover:hover){.post-card:hover .post-card-img img{transform:scale(1.05)}}
.post-card-body{padding:14px 15px 16px;display:flex;flex-direction:column;flex:1}
.post-card-body h3{font-family:'Playfair Display',serif;font-size:15.5px;font-weight:400;line-height:1.3;margin-bottom:6px}
.post-card-body p{font-size:12px;color:var(--muted);line-height:1.55;flex:1;margin-bottom:10px}
.post-card-meta{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.blog-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.blog-empty span{font-size:32px;display:block;margin-bottom:10px}
/* SINGLE POST */
.post-detail{max-width:700px;margin:0 auto;padding:24px 16px 80px;display:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--rose3);padding:8px 0;margin-bottom:20px;font-weight:500;-webkit-tap-highlight-color:transparent;background:none;border:none;cursor:pointer;text-decoration:none}
.back-btn:hover{color:var(--rose4)}
.post-detail-cover{width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--rose);margin-bottom:24px}
.post-detail-cover img{width:100%;height:100%;object-fit:cover;display:block}
.post-detail-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--rose3);background:var(--rose);border-radius:100px;padding:3px 12px;font-weight:500;margin-bottom:12px}
.post-detail h1{font-family:'Playfair Display',serif;font-size:clamp(24px,5vw,36px);font-weight:400;line-height:1.2;margin-bottom:10px}
.post-detail-meta{font-size:11.5px;color:var(--muted);margin-bottom:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post-content{font-size:15px;line-height:1.8;color:var(--text)}
.post-content h2{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,26px);font-weight:400;margin:32px 0 12px}
.post-content h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;margin:24px 0 10px}
.post-content p{margin-bottom:16px}
.post-content ul,.post-content ol{margin:0 0 16px 22px}
.post-content li{margin-bottom:8px;line-height:1.7}
.post-content strong{font-weight:500;color:var(--rose4)}
.post-content em{font-style:italic;color:var(--rose3)}
.post-content blockquote{border-left:3px solid var(--rose3);padding:10px 16px;background:var(--rose);border-radius:0 10px 10px 0;margin:20px 0;font-style:italic;color:var(--rose4);font-size:14.5px;line-height:1.7}
.post-content a{color:var(--rose3);text-decoration:underline;text-underline-offset:3px}
.numbered-section{display:flex;flex-direction:column;gap:14px;margin:20px 0 24px}
.numbered-item{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:#fff;border-radius:14px;border:1px solid var(--rose2)}
.numbered-item-num{font-family:'Playfair Display',serif;font-size:22px;color:var(--rose2);font-weight:400;min-width:28px;line-height:1;margin-top:2px}
.numbered-item-body strong{font-size:14.5px;font-weight:500;display:block;margin-bottom:3px}
.numbered-item-body p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
footer{text-align:center;padding:24px 16px;border-top:1px solid var(--rose2);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<nav>
  <div class="nav-top">
    <a class="nav-logo" href="index.html">sahar's finds ✦</a>
    <a class="nav-link" href="index.html">Shop</a>
    <a class="nav-link active" href="blog.html">Blog</a>
  </div>
</nav>

<div id="blog-list-view">
  <div class="blog-hero">
    <div class="blog-hero-inner">
      <p class="blog-eyebrow">from the journal</p>
      <h1>Sahar's <em>Travel</em> &amp; Life Blog</h1>
      <p>Real experiences, honest guides and things worth knowing before you go.</p>
    </div>
  </div>
  <div class="blog-filters" id="blog-filters">
    <button class="blog-filter-btn active" data-tag="all">✦ All</button>
  </div>
  <div class="blog-list-wrap" id="blog-list-wrap">
    <div class="loading"><div class="loading-spinner"></div><p>Loading posts…</p></div>
  </div>
</div>

<div class="post-detail" id="post-detail-view">
  <button class="back-btn" onclick="goBack()">← Back to Blog</button>
  <div id="post-detail-inner"></div>
</div>

<footer>made with love by sahar &nbsp;✦&nbsp; some links are affiliate links</footer>

<script>
// ── ⚙️ SUPABASE CONFIG — paste your values here ──
const SUPABASE_URL = 'https://zcyqynlpkzdzilmohnxh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjeXF5bmxwa3pkemlsbW9obnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDEyODMsImV4cCI6MjA4OTE3NzI4M30.kd568wumwGBsoKEkC0cE1op-uYqIrUAiLh2dKml8Wjg';

async function sbFetch(path,opts={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})},
    method:opts.method||'GET',body:opts.body||undefined
  });
  if(!res.ok)throw new Error(await res.text());
  const t=await res.text();return t?JSON.parse(t):null;
}

let ALL_POSTS=[];

async function loadPosts(){
  try{ ALL_POSTS=await sbFetch('posts?order=created_at.desc')||[]; }
  catch(e){ ALL_POSTS=[]; }
}

function renderFilters(posts){
  const tags=['all',...new Set(posts.map(p=>p.tag).filter(Boolean))];
  const f=document.getElementById('blog-filters');
  f.innerHTML=tags.map(t=>`<button class="blog-filter-btn${t==='all'?' active':''}" data-tag="${t}">${t==='all'?'✦ All':t}</button>`).join('');
  f.querySelectorAll('.blog-filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      f.querySelectorAll('.blog-filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); renderList(btn.dataset.tag);
    });
  });
}

function renderList(activeTag='all'){
  const wrap=document.getElementById('blog-list-wrap');
  const filtered=activeTag==='all'?ALL_POSTS:ALL_POSTS.filter(p=>p.tag===activeTag);
  if(!filtered.length){wrap.innerHTML=`<div class="blog-empty"><span>✦</span><p>No posts yet — check back soon!</p></div>`;return;}
  const [featured,...rest]=filtered;
  let html=`<a class="post-featured" href="#post-${featured.id}">
    <div class="post-featured-img"><img src="${featured.cover_image}" alt="${featured.title}" loading="lazy"/></div>
    <div class="post-featured-body">
      ${featured.tag?`<div class="post-tag">${featured.tag}</div>`:''}
      <h2>${featured.title}</h2>
      <p>${featured.excerpt||''}</p>
      <div class="post-meta"><span>📅 ${featured.post_date||''}</span><span>⏱ ${featured.read_time||''}</span></div>
      <div class="read-more">Read more →</div>
    </div>
  </a>`;
  if(rest.length) html+=`<div class="posts-grid">${rest.map(p=>`
    <a class="post-card" href="#post-${p.id}">
      <div class="post-card-img"><img src="${p.cover_image}" alt="${p.title}" loading="lazy"/></div>
      <div class="post-card-body">
        ${p.tag?`<div class="post-tag" style="margin-bottom:8px">${p.tag}</div>`:''}
        <h3>${p.title}</h3>
        <p>${p.excerpt||''}</p>
        <div class="post-card-meta"><span>📅 ${p.post_date||''}</span><span>· ${p.read_time||''}</span></div>
      </div>
    </a>`).join('')}</div>`;
  wrap.innerHTML=html;
}

function renderPost(id){
  const post=ALL_POSTS.find(p=>String(p.id)===String(id));
  if(!post)return false;
  let contentHtml='';
  (post.content||[]).forEach(block=>{
    if(block.type==='p') contentHtml+=`<p>${block.text}</p>`;
    else if(block.type==='h2') contentHtml+=`<h2>${block.text}</h2>`;
    else if(block.type==='h3') contentHtml+=`<h3>${block.text}</h3>`;
    else if(block.type==='blockquote') contentHtml+=`<blockquote>${block.text}</blockquote>`;
    else if(block.type==='ul') contentHtml+=`<ul>${(block.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    else if(block.type==='ol') contentHtml+=`<ol>${(block.items||[]).map(i=>`<li>${i}</li>`).join('')}</ol>`;
    else if(block.type==='numbered'){
      contentHtml+=`<div class="numbered-section">${(block.items||[]).map((it,idx)=>`
        <div class="numbered-item">
          <div class="numbered-item-num">${String(idx+1).padStart(2,'0')}</div>
          <div class="numbered-item-body"><strong>${it.title}</strong><p>${it.body||''}</p></div>
        </div>`).join('')}</div>`;
    }
  });
  document.getElementById('post-detail-inner').innerHTML=`
    <div class="post-detail-cover"><img src="${post.cover_image}" alt="${post.title}"/></div>
    ${post.tag?`<div class="post-detail-tag">${post.tag}</div>`:''}
    <h1>${post.title}</h1>
    <div class="post-detail-meta">
      ${post.post_date?`<span>📅 ${post.post_date}</span>`:''}
      ${post.read_time?`<span>⏱ ${post.read_time}</span>`:''}
    </div>
    <div class="post-content">${contentHtml}</div>`;
  return true;
}

function goBack(){history.pushState(null,null,'blog.html');showList();}
function showList(){document.getElementById('blog-list-view').style.display='block';document.getElementById('post-detail-view').style.display='none';window.scrollTo(0,0);}
function showPost(id){const ok=renderPost(id);if(!ok){showList();return;}document.getElementById('blog-list-view').style.display='none';document.getElementById('post-detail-view').style.display='block';window.scrollTo(0,0);}

function route(){
  const m=window.location.hash.match(/^#post-(.+)$/);
  if(m) showPost(m[1]); else showList();
}
window.addEventListener('hashchange',route);

async function init(){
  await loadPosts();
  renderFilters(ALL_POSTS);
  renderList();
  route();
}
init();
</script>
</body>
</html>
